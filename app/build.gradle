plugins {
    id 'com.android.application'
}

// GitHub Actions passes its run number so every build installs as an update.
def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'uk.fo.shiftpaycheck'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.fo.shiftpaycheck'
        minSdk 29
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // One fixed key so new builds install over old ones without losing data.
    signingConfigs {
        shared {
            storeFile file('signing.keystore')
            storePassword 'shiftpaycheck'
            keyAlias 'shiftpaycheck'
            keyPassword 'shiftpaycheck'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
